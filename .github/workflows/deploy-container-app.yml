name: Deploy to Azure Container App

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Azure CLI is installed
        run: |
          az --version

      # Optional: Debug secrets (remove if not needed)
      # - name: Debug secrets
      #   run: |
      #     echo "ACR_LOGIN_SERVER=${{ secrets.ACR_LOGIN_SERVER }}"

      - name: Deploy to Azure Container App
        env:
          IMAGE_NAME: ${{ secrets.ACR_LOGIN_SERVER }}/purchase-order-request-agent:latest
        run: |
          set -e
          az containerapp update \
            --name porequestservices-aca \
            --resource-group PORequestServices-cs \
            --image $IMAGE_NAME

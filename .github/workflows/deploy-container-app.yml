
name: Deploy to Azure Container App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name porequestservices-aca \
            --resource-group PORequestServices-cs \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/purchase-order-request-agent:latest
